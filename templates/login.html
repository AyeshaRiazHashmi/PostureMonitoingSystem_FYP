<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PostureGuard</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <h2>🪑 PostureGuard</h2>
            </div>
            <div class="nav-menu">
                <a href="/">Home</a>
                <a href="/signup">Sign Up</a>
            </div>
        </div>
    </nav>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome Back! 👋</h1>
                <p class="auth-subtitle">Login to continue monitoring your posture</p>
                
                <div id="errorMessage" style="display: none;" class="alert alert-danger"></div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your username">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter your password">
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        🔐 Login
                    </button>
                </form>
                
                <p class="auth-footer">
                    Don't have an account? <a href="/signup">Sign up here</a>
                </p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 PostureGuard. Helping you maintain healthy sitting posture. 💪</p>
    </footer>

    <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.style.display = 'none';
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = '⏳ Logging in...';
        submitBtn.disabled = true;
        
        const formData = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
        };
        
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(formData)
            });
            
            const data = await response.json();
            
            if (response.ok) {
                localStorage.setItem('token', data.access_token);
                submitBtn.textContent = '✅ Success!';
                window.location.href = '/dashboard';
            } else {
                errorDiv.textContent = data.detail || 'Login failed';
                errorDiv.style.display = 'block';
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            errorDiv.textContent = 'Login error: ' + error.message;
            errorDiv.style.display = 'block';
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
    </script>
</body>
</html>
